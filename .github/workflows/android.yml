name: Android

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  # Capacitor 8's bundled plugins request a Java 21 toolchain.
  JAVA_VERSION: '21'
  NODE_VERSION: '22'

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build the web bundle
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Copy web assets into the Android project
        run: npx cap sync android

      - name: Assemble debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Name the APK for this build
        id: apk
        run: |
          VER=$(grep -m1 'versionName ' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          SHA=$(git rev-parse --short HEAD)
          NAME="aircast-v${VER}-b${{ github.run_number }}-${SHA}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "Built $NAME"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error
          retention-days: 90

      # A retained, uniquely-named release per build — keeps every version's APK.
      - name: Publish per-build release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AirCast v${{ steps.apk.outputs.ver }} · build #${{ github.run_number }}
          body: |
            Debug build of commit ${{ github.sha }}.
          prerelease: true
          fail_on_unmatched_files: false
          files: ${{ steps.apk.outputs.name }}

      # Rolling "latest" link for convenience: keeps a stable app-debug.apk URL
      # plus the versioned copy for this build.
      - name: Refresh debug-latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: AirCast — latest debug APK
          body: |
            Newest debug build. Version v${{ steps.apk.outputs.ver }}, build #${{ github.run_number }}, commit ${{ github.sha }}.
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            ${{ steps.apk.outputs.name }}

  release:
    name: Signed release
    # Only tags produce release artefacts; every other push just proves it compiles.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      # Job-level, not step-level: a step's own `env:` block is not in scope for
      # that step's `if:`, so a step-scoped secret would make the guard always false
      # and silently publish unsigned artefacts.
      KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - run: npx cap sync android

      # Signing is optional: without the secrets the job still produces an unsigned
      # APK/AAB rather than failing, so a fresh fork can cut a tag on day one.
      - name: Restore signing key
        if: env.KEYSTORE != ''
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE" | base64 -d > android/release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build release APK and AAB
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      # Makes a silently-unsigned release visible in the log instead of only at
      # install time on someone's device.
      - name: Report signing status
        run: |
          ls -la android/app/build/outputs/apk/release/
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n1)
          if [ -f android/keystore.properties ]; then
            "$ANDROID_HOME"/build-tools/*/apksigner verify --print-certs "$APK" \
              || echo "::error::signing was configured but apksigner could not verify $APK"
          else
            echo "::warning::No signing secrets configured - publishing an UNSIGNED build."
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          generate_release_notes: true
          fail_on_unmatched_files: false
