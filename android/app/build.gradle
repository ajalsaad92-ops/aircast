apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

// ---------------------------------------------------------------------------
// Optional release signing.
//   * Locally : create android/keystore.properties (see README) — it is gitignored.
//   * In CI   : the workflow writes that same file from repository secrets.
// When absent, `assembleRelease` still runs and produces an *unsigned* APK.
// ---------------------------------------------------------------------------
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasSigning = false
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
    hasSigning = keystoreProps['storeFile'] != null && rootProject.file(keystoreProps['storeFile']).exists()
}

android {
    namespace = "com.aircast.receiver"
    compileSdk = rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "com.aircast.receiver"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 24
        versionName "1.24.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }

    if (hasSigning) {
        signingConfigs {
            release {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    // Capacitor 8's bundled plugins request a Java 21 toolchain, so the app module
    // matches it — mixing 17 here and 21 there makes Gradle fork two compilers.
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF']
        }
    }

    lint {
        abortOnError false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
    mavenCentral()
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')

    // --- AirCast: media playback (DLNA / AirPlay rendering) ---
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$media3Version"

    // --- AirCast: runtime self-signed TLS certificate with IP SANs ---
    // Needed so the browser-based mirroring sender page runs in a *secure context*
    // (getDisplayMedia is blocked on plain-http non-localhost origins).
    implementation "org.bouncycastle:bcprov-jdk18on:$bouncyCastleVersion"
    implementation "org.bouncycastle:bcpkix-jdk18on:$bouncyCastleVersion"

    // --- AirCast: WebRTC for Cast mirroring (Quest) ---
    implementation "io.github.webrtc-sdk:android:125.6422.06.1"

    // --- AirCast: mDNS responder for a stable aircast.local hostname ---
    implementation "org.jmdns:jmdns:3.5.9"

    // --- AirCast: SMB2/3 read-only media browser (local network share browser) ---
    implementation "eu.agno3.jcifs:jcifs-ng:2.1.10"

    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
